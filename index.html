<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Imposter: a real-time multiplayer social deduction word game. Trust nobody. Read everybody." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Imposter: Trust Nobody. Read Everybody.</title>
    <style>
      html, body { background: #0d0d12; margin: 0; }
      #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; background: #0d0d12; transition: opacity .3s ease; }
      @keyframes ghost-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes ghost-ring { 0% { transform: scale(.7); opacity: .6; } 100% { transform: scale(1.7); opacity: 0; } }
      @keyframes ghost-blink { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
      @keyframes ghost-dot { 0%,80%,100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
      .boot-wrap { position: relative; width: 120px; height: 120px; display: grid; place-items: center; }
      .boot-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(139,92,246,.6); animation: ghost-ring 2.2s ease-out infinite; }
      .boot-ring.r2 { animation-delay: 1.1s; border-color: rgba(255,59,92,.5); }
      .boot-ghost { width: 84px; height: 84px; animation: ghost-float 2.4s ease-in-out infinite; filter: drop-shadow(0 8px 24px rgba(139,92,246,.45)); }
      .boot-eye { animation: ghost-blink 2.4s ease-in-out infinite; }
      .boot-dots { display: flex; gap: 8px; }
      .boot-dots b { width: 8px; height: 8px; border-radius: 50%; background: #8b5cf6; animation: ghost-dot 1.2s ease-in-out infinite; }
      .boot-dots b:nth-child(2) { animation-delay: .15s; } .boot-dots b:nth-child(3) { animation-delay: .3s; }
      
    </style>
  </head>
  <body>
    <div id="boot"><div class="boot-wrap"><i class="boot-ring"></i><i class="boot-ring r2"></i><svg class="boot-ghost" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 12c-9 0-15 6-15 15v14c0 3 2 5 5 5h4l2-4 2 4h4l2-4 2 4h4c3 0 5-2 5-5V27c0-9-6-15-15-15z" fill="#8b5cf6"/><circle cx="26" cy="29" r="3.5" fill="#0d0d12"/><circle class="boot-eye" cx="38" cy="29" r="3.5" fill="#ff3b5c"/></svg></div><div class="boot-dots"><b></b><b></b><b></b></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
