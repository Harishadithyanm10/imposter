name: Build Imposter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Configure Firebase Android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Missing GitHub secret: GOOGLE_SERVICES_JSON_BASE64"
            exit 1
          fi

          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Check duplicate classes
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:checkDebugDuplicateClasses --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imposter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7