# ONE-TIME helper: creates an Android signing key so your builds always have the same signature
# (needed for Google sign-in and for uploading to Google Play).
# Run it from the Actions tab, download the "android-keystore" artifact, copy the 4 values into your repository
# secrets, then DELETE the workflow run and artifact. Only use it in a PRIVATE repository.
name: Create Android keystore (one time)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run in a public repository
        if: ${{ github.event.repository.private == false }}
        run: |
          echo "::error::This repository is public, so the artifact would be downloadable by anyone. Make the repository private, or create the keystore on your own computer with 'keytool' (see MOBILE.md)."
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate the keystore
        run: |
          mkdir out
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -storetype PKCS12 -keystore out/release.keystore -alias imposter \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Imposter, OU=Mobile, O=Imposter, C=US"
          base64 -w0 out/release.keystore > out/ANDROID_KEYSTORE_BASE64.txt
          {
            echo "### SHA-1 / SHA-256 fingerprints (add the SHA-1 in Firebase > Project settings > your Android app)"
            echo '```'
            keytool -list -v -keystore out/release.keystore -storepass "$PASS" | grep -E "SHA1|SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=imposter"
            echo "(ANDROID_KEYSTORE_BASE64 is the content of ANDROID_KEYSTORE_BASE64.txt)"
          } > out/secrets-to-copy.txt
          rm out/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: out/*
          retention-days: 1
